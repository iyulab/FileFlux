name: 📦 NuGet Package Build & Publish

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Directory.Build.props'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish to NuGet.org'
        required: false
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version:
    name: 🔍 Detect Version Changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: 📊 Extract Version from Directory.Build.props
        id: extract-version
        run: |
          VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]*' Directory.Build.props)
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  publish:
    name: 📦 Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-version
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Pack every packable project in the solution, not just the two named after the repository.
      # Packing individual csproj files by name left FileFlux.Providers.LMSupply — packable, and in
      # the solution since it was added (cycle-307) — never published at any version. Nothing failed:
      # a package that is never produced cannot fail to push. Same defect class, same fix, as
      # FluxImprover's publish.yml (iyulab/FluxImprover@4f01b46).
      - name: 📦 Create NuGet Packages
        run: |
          dotnet pack FileFlux.slnx \
            --configuration Release \
            --output nupkg/ \
            -p:PackageVersion=${{ needs.detect-version.outputs.version }} \
            -p:AssemblyVersion=${{ needs.detect-version.outputs.version }} \
            -p:FileVersion=${{ needs.detect-version.outputs.version }}

      - name: 📋 Verify Generated Packages
        run: |
          ls -la nupkg/
          version="${{ needs.detect-version.outputs.version }}"
          missing=0
          # Assumes PackageId matches the csproj filename, which holds in this repository (verified).
          for csproj in $(grep -oP '(?<=Path=")src/[^"]+\.csproj' FileFlux.slnx); do
            id=$(basename "$csproj" .csproj)
            if [ ! -f "nupkg/${id}.${version}.nupkg" ]; then
              echo "::error::${id}.${version}.nupkg was not produced"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: 🚀 Publish to NuGet.org
        run: |
          dotnet nuget push nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \
            --no-symbols
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: 🏷️ Create Git Tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          TAG="v${{ needs.detect-version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin (e.g. from a prior partial run) — skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-completion:
    name: 📢 Notify Completion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-version, publish]
    if: always()
    steps:
      - name: 🎉 Success Notification
        if: needs.publish.result == 'success'
        run: |
          echo "🎉 Successfully published FileFlux v${{ needs.detect-version.outputs.version }} to NuGet.org!"
          echo "📦 Core: https://www.nuget.org/packages/FileFlux.Core/${{ needs.detect-version.outputs.version }}"
          echo "📦 SDK: https://www.nuget.org/packages/FileFlux/${{ needs.detect-version.outputs.version }}"
          echo "📦 LMSupply: https://www.nuget.org/packages/FileFlux.Providers.LMSupply/${{ needs.detect-version.outputs.version }}"

      - name: ❌ Failure Notification
        if: needs.publish.result != 'success'
        run: |
          echo "❌ Failed to publish FileFlux v${{ needs.detect-version.outputs.version }}"
          exit 1
