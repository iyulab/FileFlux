name: 📦 NuGet Package Build & Publish

on:
  push:
    branches: [ main ]
    paths:
      - 'Directory.Build.props'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish to NuGet.org'
        required: false
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; every job below asks for what it needs.
permissions: {}

# The push to nuget.org is not made here. This workflow packs, uploads the packages as an artifact and asks the organization's
# central publisher (iyulab/nuget-publish) to push them; that repository holds the only trusted-publishing policy and checks this
# repository, this workflow file and the package ids against an allowlist. No NuGet credential lives here.
jobs:
  detect-version:
    name: 🔍 Detect Version Changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: 📊 Extract Version from Directory.Build.props
        id: extract-version
        run: |
          VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]*' Directory.Build.props)
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  pack:
    name: 📦 Build & Pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    needs: detect-version
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Pack every packable project in the solution, not just the two named after the repository.
      # Packing individual csproj files by name silently skips any packable project not on the list,
      # and nothing fails: a package that is never produced cannot fail to push.
      - name: 📦 Create NuGet Packages
        run: |
          dotnet pack FileFlux.slnx \
            --configuration Release \
            --output nupkg/ \
            -p:PackageVersion=${{ needs.detect-version.outputs.version }} \
            -p:AssemblyVersion=${{ needs.detect-version.outputs.version }} \
            -p:FileVersion=${{ needs.detect-version.outputs.version }}

      - name: 📋 Verify Generated Packages
        run: |
          ls -la nupkg/
          version="${{ needs.detect-version.outputs.version }}"
          missing=0
          # Assumes PackageId matches the csproj filename, which holds in this repository (verified).
          for csproj in $(grep -oP '(?<=Path=")src/[^"]+\.csproj' FileFlux.slnx); do
            id=$(basename "$csproj" .csproj)
            if [ ! -f "nupkg/${id}.${version}.nupkg" ]; then
              echo "::error::${id}.${version}.nupkg was not produced"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      # Only .nupkg files, as before (the old push used `--no-symbols`); the central publisher pushes every .snupkg it finds.
      - name: 📤 Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 1

  # Asks the central publisher to push the packages and waits for its answer: this job succeeds only when they are on nuget.org.
  # Until the repository is on the publisher's allowlist the call is refused and the jobs after it do not run.
  publish:
    name: 🚀 Publish to NuGet.org
    needs: pack
    uses: iyulab/nuget-publish/.github/workflows/request.yml@2166748abf716fb58855228f65fc6b8f78c2780f # main
    permissions: {}
    secrets: inherit

  # The tag and the GitHub release exist only for a version that reached nuget.org (`gh release create` makes the tag).
  release:
    name: 🏷️ GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    permissions:
      contents: write   # tag + GitHub release
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5

      # Release notes = this version's CHANGELOG.md section. Every iyulab publish workflow carries this awk program
      # verbatim; change it in all of them or in none.
      - name: GitHub release (notes = this version's CHANGELOG section)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP '<(Version|VersionPrefix)>\K[^<]+' Directory.Build.props | head -1)
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "Release v$VERSION already exists"; exit 0; fi
          awk -v v="$VERSION" '/^## /{if(p)exit;h=$0;sub(/^## +\[?v?/,"",h);c=substr(h,length(v)+1,1);if(index(h,v)==1&&(c==""||c=="]"||c==" "||c=="\t")){p=1;next}}p&&(n||$0!~/^[ \t]*$/){l[++n]=$0}END{while(n&&(l[n]~/^[ \t]*$/||l[n]~/^---+$/))n--;for(i=1;i<=n;i++)print l[i]}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; fi
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md --target "$GITHUB_SHA"

  notify-completion:
    name: 📢 Notify Completion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-version, publish]
    if: always()
    steps:
      - name: 🎉 Success Notification
        if: needs.publish.result == 'success'
        run: |
          echo "🎉 Successfully published FileFlux v${{ needs.detect-version.outputs.version }} to NuGet.org!"
          echo "📦 Core: https://www.nuget.org/packages/FileFlux.Core/${{ needs.detect-version.outputs.version }}"
          echo "📦 SDK: https://www.nuget.org/packages/FileFlux/${{ needs.detect-version.outputs.version }}"
          echo "📦 LMSupply: https://www.nuget.org/packages/FileFlux.Providers.LMSupply/${{ needs.detect-version.outputs.version }}"

      - name: ❌ Failure Notification
        if: needs.publish.result != 'success'
        run: |
          echo "❌ Failed to publish FileFlux v${{ needs.detect-version.outputs.version }}"
          exit 1
