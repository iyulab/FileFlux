name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FileFlux.slnx

      - name: Build
        run: dotnet build FileFlux.slnx --no-restore -c Release

      - name: Test
        # Ecosystem CI convention: exclude externally-dependent categories. FileFlux currently
        # declares only Category=Integration, but the other two are kept so a future
        # RequiresApiKey/Performance test does not silently start gating CI.
        # --hangdump/--hangdump-timeout is MTP's equivalent of VSTest's --blame-hang — turns a
        # silent 20-minute timeout-cancel into a 5-minute dump naming the hung test — the reader
        # tests exercise native FFI (Undoc/Unpdf), where a hang is the plausible failure mode
        # rather than an assertion failure. --filter-not-trait (repeated, ANDs together) is MTP's
        # equivalent of VSTest's compound "Category!=A&Category!=B" filter syntax.
        run: dotnet test FileFlux.slnx --no-build -c Release --verbosity normal --filter-not-trait "Category=Integration" --filter-not-trait "Category=RequiresApiKey" --filter-not-trait "Category=Performance" --hangdump --hangdump-timeout 5m
